<!--doctype html-->
<html>
<head>
<style>

img{
    width: 100px;
    height: 100px;
    position: relative;
    animation-name: myAnimation;
    animation-duration: 3s;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;

}


@keyframes myAnimation {
  0%   {
        left:0px;
        top:0px;
        }
  25%  {
        left:80%;
        top:0px;
        transform: rotate(180deg);
        }
  50%  {
        left:80%;
        top:80vh;
        transform: rotateY(3600deg);
        }
  75%  {
        left:0px;
        top:80vh;
        } 
  100%  {
        left:0px;
        top:0px;
        }      
}


body{
    background: url("https://static0.polygonimages.com/wordpress/wp-content/uploads/2025/12/hollow-knight-silksong-sea-sorrow.png?w=1600&h=900&fit=crop");
    background-size: cover;
}
</style>
